services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspace:cached
    command: sleep infinity
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=master;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd!"
    ports:
      - "1434:1433"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
